[project]
name = "hintbookmaker"
version = "0.1.0"
description = "MarkdownからPowerPointスライドを自動生成するツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.2",
]

[project.scripts]
hintbookmaker = "hintbookmaker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
